<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .prose pre { background-color: #1f2937; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { color: #60a5fa; }
        .layout-transition { transition: all 0.3s ease; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .chip-scroll { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .chip-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header & Arama -->
    <header class="bg-gray-800 p-4 shadow-md z-10 flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h1 id="headerTitle" class="text-xl font-bold text-blue-400 cursor-pointer flex items-center gap-2" onclick="goHome()">
                <svg id="backIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span id="titleText">Kategoriler</span>
            </h1>
            <div class="flex items-center space-x-2">
                <button onclick="openSettings()" class="p-2 bg-gray-700 rounded-lg active:scale-95 text-gray-300 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button onclick="toggleLayout()" id="layoutBtn" class="p-2 bg-gray-700 rounded-lg active:scale-95 text-gray-300 hover:text-white">
                    <svg id="icon-grid" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <svg id="icon-list" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tüm metinlerde ara..." class="w-full bg-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div id="tagBarContainer" class="hidden">
            <div id="tagScrollArea" class="chip-scroll flex space-x-2 pb-1"></div>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 overflow-y-auto p-4 hide-scrollbar">
        <div id="mainContainer" class="layout-transition"></div>
    </main>

    <!-- FAB (Ekleme Butonu) -->
    <button onclick="openPromptModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 rounded-full shadow-lg flex items-center justify-center hover:bg-blue-500 active:scale-90 transition-transform z-20">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <!-- Akıllı Değişken Modalı -->
    <div id="variableModal" class="fixed inset-0 bg-gray-900/90 z-[60] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col max-h-[80vh]">
            <h3 class="text-xl font-bold text-blue-400 mb-1">Değişkenleri Doldur</h3>
            <p class="text-xs text-gray-400 mb-5 leading-relaxed">Boş bıraktığınız alanlar, metne sadece isimleri kalacak şekilde eklenir.</p>
            <div id="variableInputsContainer" class="space-y-4 overflow-y-auto hide-scrollbar flex-1 mb-6 pr-1"></div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeVariableModal()" class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl font-medium active:scale-95 transition">İptal</button>
                <button onclick="executeVariableCopy()" class="flex-[2] py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold shadow-lg shadow-blue-900/50 active:scale-95 transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg> Kopyala
                </button>
            </div>
        </div>
    </div>

    <!-- Ayarlar Modalı (Sıralama Eklendi) -->
    <div id="settingsModal" class="fixed inset-0 bg-gray-900 z-50 hidden flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-700 bg-gray-800">
            <h2 class="text-lg font-bold">Kategori Ayarları</h2>
            <button onclick="closeSettings()" class="p-2 text-gray-400 hover:text-white">Kapat</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 bg-gray-900 space-y-6">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex gap-2">
                <input type="text" id="newCategoryName" placeholder="Yeni kategori adı..." class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addNewCategory()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold active:scale-95">Ekle</button>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Sırala ve Düzenle</h3>
                <div id="categoriesList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Ekle / Düzenle Modalı -->
    <div id="promptModal" class="fixed inset-0 bg-gray-900 z-50 hidden flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-700 bg-gray-800">
            <h2 id="modalTitle" class="text-lg font-bold">Yeni Prompt</h2>
            <button onclick="closePromptModal()" class="p-2 text-gray-400 hover:text-white">Kapat</button>
        </div>
        
        <div class="flex border-b border-gray-700 bg-gray-800">
            <button onclick="switchTab('edit')" id="tabEdit" class="flex-1 py-3 text-center border-b-2 border-blue-500 text-blue-500 font-medium">Düzenle</button>
            <button onclick="switchTab('preview')" id="tabPreview" class="flex-1 py-3 text-center border-b-2 border-transparent text-gray-400 font-medium">Önizleme</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 bg-gray-900">
            <div id="editArea" class="space-y-4">
                <input type="hidden" id="promptId">
                <input type="text" id="promptTitle" placeholder="Başlık" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2">
                    <select id="promptCategory" class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white appearance-none"></select>
                    <input type="text" id="promptTag" placeholder="Alt Etiket (Örn: Soru Çözüm)" class="w-1/2 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <textarea id="promptContent" placeholder="Metin... Değişkenler için [[isim]] kullanın." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 h-56 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </div>
            <div id="previewArea" class="hidden prose prose-invert max-w-none text-gray-200"></div>
        </div>

        <div class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
            <button onclick="deletePrompt()" id="deleteBtn" class="hidden bg-red-600/20 text-red-500 px-4 py-3 rounded-xl font-bold active:scale-95 border border-red-600/50">Sil</button>
            <button onclick="copyFromEditor()" id="editorCopyBtn" class="hidden bg-gray-700 text-white px-4 py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            </button>
            <button onclick="savePrompt()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 shadow-lg shadow-blue-900/50">KAYDET</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-[70] font-medium flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Kopyalandı!
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }

        const kategoriRenkPaleti = ['#22C55E', '#F97316', '#A855F7', '#6366F1', '#64748B', '#EC4899', '#06B6D4', '#EAB308', '#F43F5E'];
        function rastgeleKategoriRengiUret() { return `hsl(${Math.floor(Math.random() * 360)}, 80%, 60%)`; }

        let prompts = JSON.parse(localStorage.getItem('app_prompts')) || [];
        let categories = JSON.parse(localStorage.getItem('app_categories')) || [];
        
        let currentView = localStorage.getItem('app_currentView') || 'folders'; 
        let isGridView = localStorage.getItem('app_isGridView') === 'true';
        let activeCategoryFilter = null; 
        let activeSubTagFilter = 'all'; 

        let pendingCopyText = "";

        if(categories.length === 0) {
            ['Genel', 'Tarih', 'Kodlama'].forEach((name, i) => { categories.push({ id: Date.now() + i, name, color: kategoriRenkPaleti[i] }); });
            saveCategories();
        }

        initApp();

        function initApp() { updateLayoutIcon(); renderMain(); }
        function savePrompts() { localStorage.setItem('app_prompts', JSON.stringify(prompts)); }
        function saveCategories() { localStorage.setItem('app_categories', JSON.stringify(categories)); }
        function saveViewState() { localStorage.setItem('app_currentView', currentView); localStorage.setItem('app_isGridView', isGridView); }

        function updateLayoutIcon() {
            const iconGrid = document.getElementById('icon-grid'), iconList = document.getElementById('icon-list');
            if (isGridView) { iconGrid.classList.add('hidden'); iconList.classList.remove('hidden'); } 
            else { iconList.classList.add('hidden'); iconGrid.classList.remove('hidden'); }
        }

        function toggleLayout() {
            isGridView = !isGridView;
            if(currentView === 'folders') { currentView = 'prompts'; activeCategoryFilter = null; activeSubTagFilter = 'all'; }
            saveViewState(); updateLayoutIcon(); renderMain();
        }

        function goHome() {
            document.getElementById('searchInput').value = '';
            currentView = 'folders'; activeCategoryFilter = null; activeSubTagFilter = 'all';
            saveViewState(); renderMain();
        }

        function openCategory(catName) {
            activeCategoryFilter = catName; activeSubTagFilter = 'all';
            currentView = 'prompts'; document.getElementById('searchInput').value = '';
            saveViewState(); renderMain();
        }

        function setSubTagFilter(tag) { activeSubTagFilter = tag; renderMain(); }

        function handleSearch() {
            const term = document.getElementById('searchInput').value;
            if(term.length > 0) { currentView = 'prompts'; activeCategoryFilter = null; activeSubTagFilter = 'all'; } 
            else if (currentView !== 'folders' && !activeCategoryFilter) { currentView = 'folders'; }
            renderMain();
        }

        function getCategoryColor(catName) { const cat = categories.find(c => c.name === catName); return cat ? cat.color : '#64748B'; }

        // Sabitleme İşlemi
        function togglePin(id, event) {
            if(event) event.stopPropagation();
            const p = prompts.find(p => p.id === id);
            if(p) {
                p.isPinned = !p.isPinned;
                savePrompts();
                renderMain();
            }
        }

        function renderMain() {
            const container = document.getElementById('mainContainer');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const headerTitle = document.getElementById('titleText');
            const backIcon = document.getElementById('backIcon');
            const tagBarContainer = document.getElementById('tagBarContainer');
            const tagScrollArea = document.getElementById('tagScrollArea');

            container.innerHTML = '';
            tagBarContainer.classList.add('hidden');

            // Klasörler
            if (currentView === 'folders' && term === '') {
                headerTitle.innerText = 'Kategoriler'; backIcon.classList.add('hidden');
                container.className = 'grid grid-cols-2 gap-4 layout-transition';
                
                categories.forEach(cat => {
                    const count = prompts.filter(p => p.category === cat.name).length;
                    container.innerHTML += `
                        <div onclick="openCategory('${cat.name}')" class="bg-gray-800 rounded-2xl p-5 border border-gray-700 shadow-sm flex flex-col items-center justify-center text-center cursor-pointer active:scale-95 transition-transform">
                            <div class="w-12 h-12 rounded-full mb-3 flex items-center justify-center" style="background-color: ${cat.color}20; color: ${cat.color}">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                            </div>
                            <h3 class="font-bold text-gray-100">${cat.name}</h3>
                            <span class="text-xs text-gray-400 mt-1">${count} Metin</span>
                        </div>
                    `;
                });
                return;
            }

            // Metinler
            let filtered = prompts;
            if (activeCategoryFilter && term === '') {
                headerTitle.innerText = activeCategoryFilter; backIcon.classList.remove('hidden');
                filtered = filtered.filter(p => p.category === activeCategoryFilter);
                const uniqueTags = [...new Set(filtered.map(p => p.tag).filter(t => t && t.trim() !== ''))];
                
                if (uniqueTags.length > 0) {
                    tagBarContainer.classList.remove('hidden');
                    let tagHtml = `<button onclick="setSubTagFilter('all')" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${activeSubTagFilter === 'all' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">Tümü</button>`;
                    uniqueTags.forEach(tag => {
                        tagHtml += `<button onclick="setSubTagFilter('${tag}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors ${activeSubTagFilter === tag ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">${tag}</button>`;
                    });
                    tagScrollArea.innerHTML = tagHtml;
                }
                if (activeSubTagFilter !== 'all') filtered = filtered.filter(p => p.tag === activeSubTagFilter);
            } else {
                headerTitle.innerText = term ? 'Arama Sonuçları' : 'Tüm Metinler'; backIcon.classList.remove('hidden');
            }

            if (term) filtered = filtered.filter(p => p.title.toLowerCase().includes(term) || p.content.toLowerCase().includes(term));
            
            // Sıralama: Önce Sabitlenenler, Sonra Yeniler
            filtered.sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return b.id - a.id;
            });

            container.className = isGridView ? 'grid grid-cols-2 gap-4 layout-transition' : 'flex flex-col space-y-4 layout-transition';
            if(filtered.length === 0) { container.innerHTML = `<div class="col-span-2 text-center text-gray-500 mt-10">Kayıt bulunamadı.</div>`; return; }

            filtered.forEach(p => {
                const color = getCategoryColor(p.category);
                const snippet = p.content.length > 80 ? p.content.substring(0, 80) + '...' : p.content;
                const tagBadge = p.tag ? `<span class="ml-2 text-[9px] text-gray-400 uppercase bg-gray-700 px-1.5 py-0.5 rounded">${p.tag}</span>` : '';
                
                // Pin İkonu Rengi ve SVG'si
                const pinColorClass = p.isPinned ? "text-yellow-400" : "text-gray-500 hover:text-gray-400";
                const pinSvg = p.isPinned 
                    ? `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>` // Dolu
                    : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M17.59 19.34a2.14 2.14 0 01-3.13 0L12 16.88l-2.46 2.46a2.14 2.14 0 01-3.13-3.13l2.46-2.46L6.41 11.3a2.14 2.14 0 010-3.13l4.58-4.58a2.14 2.14 0 013.13 0l4.58 4.58a2.14 2.14 0 010 3.13l-2.46 2.46 2.46 2.46a2.14 2.14 0 010 3.13z"></path></svg>`; // Outline Thumbtack alternatifi

                container.innerHTML += `
                    <div class="bg-gray-800 border ${p.isPinned ? 'border-gray-600 shadow-md' : 'border-gray-700 shadow-sm'} rounded-2xl p-4 relative group active:bg-gray-750 transition-colors flex flex-col">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center">
                                <!-- Pin Butonu -->
                                <button onclick="togglePin(${p.id}, event)" class="mr-2 p-1 rounded transition-colors active:scale-90 z-10 ${pinColorClass}">
                                    <svg class="w-4 h-4" fill="${p.isPinned ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                </button>
                                <span class="text-[10px] uppercase font-bold px-2 py-1 rounded border" style="background-color: ${color}15; color: ${color}; border-color: ${color}30;">${p.category}</span>
                                ${tagBadge}
                            </div>
                            <button onclick="initiateSmartCopy('${encodeURIComponent(p.content)}', event)" class="p-2 bg-gray-700 hover:bg-blue-600 rounded-lg text-gray-300 hover:text-white transition-colors active:scale-90 z-10">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            </button>
                        </div>
                        <div onclick="editPrompt(${p.id})" class="cursor-pointer flex-1">
                            <h3 class="font-bold text-gray-100 leading-tight mb-2 ${isGridView ? 'text-sm' : 'text-base'}">${p.title}</h3>
                            <p class="text-gray-400 ${isGridView ? 'text-xs line-clamp-3' : 'text-sm line-clamp-2'} whitespace-pre-wrap">${snippet}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Akıllı Kopya
        function initiateSmartCopy(encodedText, event) {
            if(event) event.stopPropagation();
            const text = decodeURIComponent(encodedText);
            const matches = [...text.matchAll(/\[\[(.*?)\]\]/g)];
            if (matches.length === 0) { executeFinalCopy(text); return; }

            pendingCopyText = text;
            const uniqueVars = [...new Set(matches.map(m => m[1]))];
            const container = document.getElementById('variableInputsContainer');
            container.innerHTML = '';
            uniqueVars.forEach((varName, idx) => {
                container.innerHTML += `<div class="bg-gray-900/50 p-3 rounded-xl border border-gray-700"><label class="block text-xs font-semibold text-blue-400 mb-1 uppercase tracking-wide">${varName}</label><input type="text" id="var_input_${idx}" data-varname="${varName}" placeholder="Örn: ${varName}" class="w-full bg-transparent border-none text-white focus:ring-0 p-0 text-sm outline-none placeholder-gray-600"></div>`;
            });
            document.getElementById('variableModal').classList.remove('hidden'); document.getElementById('variableModal').classList.add('flex');
            setTimeout(() => { document.getElementById('var_input_0')?.focus(); }, 100);
        }

        function executeVariableCopy() {
            let finalText = pendingCopyText;
            document.querySelectorAll('#variableInputsContainer input').forEach(input => {
                const varName = input.getAttribute('data-varname'), val = input.value.trim();
                finalText = finalText.replace(new RegExp(`\\[\\[${varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\]\\]`, 'g'), val !== "" ? val : varName);
            });
            executeFinalCopy(finalText); closeVariableModal();
        }
        function closeVariableModal() { document.getElementById('variableModal').classList.add('hidden'); document.getElementById('variableModal').classList.remove('flex'); }
        function executeFinalCopy(text) { navigator.clipboard.writeText(text).then(() => { const toast = document.getElementById('toast'); toast.classList.remove('opacity-0'); setTimeout(() => toast.classList.add('opacity-0'), 1500); }); }
        function copyFromEditor() { initiateSmartCopy(encodeURIComponent(document.getElementById('promptContent').value)); }

        // Ayarlar, Kategori Taşıma ve Ekleme
        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); document.getElementById('settingsModal').classList.add('flex'); renderCategoriesSettings(); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); document.getElementById('settingsModal').classList.remove('flex'); renderMain(); }

        function moveCategory(index, direction) {
            if (index + direction < 0 || index + direction >= categories.length) return;
            const temp = categories[index];
            categories[index] = categories[index + direction];
            categories[index + direction] = temp;
            saveCategories();
            renderCategoriesSettings();
        }

        function renderCategoriesSettings() {
            const list = document.getElementById('categoriesList'); list.innerHTML = '';
            categories.forEach((cat, index) => {
                list.innerHTML += `
                <div class="flex items-center justify-between bg-gray-800 border border-gray-700 p-2 rounded-lg">
                    <div class="flex items-center space-x-3 pl-1">
                        <input type="color" value="${hslToHex(cat.color)}" onchange="updateCategoryColor(${cat.id}, this.value)">
                        <span class="font-medium">${cat.name}</span>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="moveCategory(${index}, -1)" class="p-2 text-gray-500 hover:text-white ${index === 0 ? 'invisible' : ''}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg></button>
                        <button onclick="moveCategory(${index}, 1)" class="p-2 text-gray-500 hover:text-white ${index === categories.length - 1 ? 'invisible' : ''}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                        <button onclick="deleteCategory(${cat.id})" class="p-2 text-gray-500 hover:text-red-500 ml-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                </div>`;
            });
        }

        function addNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim(); if(!name) return;
            categories.push({ id: Date.now(), name, color: categories.length < kategoriRenkPaleti.length ? kategoriRenkPaleti[categories.length] : rastgeleKategoriRengiUret() });
            saveCategories(); document.getElementById('newCategoryName').value = ''; renderCategoriesSettings();
        }
        function updateCategoryColor(id, hexColor) { const cat = categories.find(c => c.id === id); if(cat) { cat.color = hexColor; saveCategories(); } }
        function deleteCategory(id) {
            if(confirm("Kategori silinsin mi? (İçindeki metinler 'Genel' olur)")) {
                const catName = categories.find(c => c.id === id).name;
                prompts.forEach(p => { if(p.category === catName) p.category = 'Genel'; });
                categories = categories.filter(c => c.id !== id); savePrompts(); saveCategories(); renderCategoriesSettings();
            }
        }

        // CRUD
        function openPromptModal() {
            document.getElementById('promptCategory').innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            document.getElementById('promptId').value = ''; document.getElementById('promptTitle').value = '';
            document.getElementById('promptCategory').value = activeCategoryFilter || categories[0].name;
            document.getElementById('promptTag').value = ''; document.getElementById('promptContent').value = '';
            document.getElementById('modalTitle').innerText = 'Yeni Metin';
            document.getElementById('deleteBtn').classList.add('hidden'); document.getElementById('editorCopyBtn').classList.add('hidden');
            switchTab('edit'); document.getElementById('promptModal').classList.remove('hidden'); document.getElementById('promptModal').classList.add('flex');
        }

        function editPrompt(id) {
            document.getElementById('promptCategory').innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            const p = prompts.find(p => p.id === id); if(!p) return;
            if(!categories.find(c => c.name === p.category)) document.getElementById('promptCategory').innerHTML += `<option value="${p.category}">${p.category}</option>`;
            document.getElementById('promptId').value = p.id; document.getElementById('promptTitle').value = p.title;
            document.getElementById('promptCategory').value = p.category; document.getElementById('promptTag').value = p.tag || '';
            document.getElementById('promptContent').value = p.content;
            document.getElementById('modalTitle').innerText = 'Metni Düzenle';
            document.getElementById('deleteBtn').classList.remove('hidden'); document.getElementById('editorCopyBtn').classList.remove('hidden');
            switchTab('edit'); document.getElementById('promptModal').classList.remove('hidden'); document.getElementById('promptModal').classList.add('flex');
        }

        function closePromptModal() { document.getElementById('promptModal').classList.add('hidden'); document.getElementById('promptModal').classList.remove('flex'); }

        function savePrompt() {
            const id = document.getElementById('promptId').value, title = document.getElementById('promptTitle').value.trim();
            const category = document.getElementById('promptCategory').value, tag = document.getElementById('promptTag').value.trim();
            const content = document.getElementById('promptContent').value.trim();
            if (!title || !content) return alert("Başlık ve içerik zorunludur!");
            if (id) { 
                const i = prompts.findIndex(p => p.id == id); 
                const existingPin = prompts[i].isPinned; // Pin durumunu koru
                prompts[i] = { id: parseInt(id), title, category, tag, content, isPinned: existingPin }; 
            } 
            else { prompts.push({ id: Date.now(), title, category, tag, content, isPinned: false }); }
            savePrompts(); renderMain(); closePromptModal();
        }

        function deletePrompt() { if(confirm("Silmek istediğine emin misin?")) { prompts = prompts.filter(p => p.id != document.getElementById('promptId').value); savePrompts(); renderMain(); closePromptModal(); } }

        function switchTab(tab) {
            const ea = document.getElementById('editArea'), pa = document.getElementById('previewArea'), te = document.getElementById('tabEdit'), tp = document.getElementById('tabPreview');
            if (tab === 'preview') {
                pa.innerHTML = marked.parse(document.getElementById('promptContent').value || '*Boş*');
                ea.classList.add('hidden'); pa.classList.remove('hidden');
                tp.classList.replace('border-transparent', 'border-blue-500'); tp.classList.replace('text-gray-400', 'text-blue-500');
                te.classList.replace('border-blue-500', 'border-transparent'); te.classList.replace('text-blue-500', 'text-gray-400');
            } else {
                pa.classList.add('hidden'); ea.classList.remove('hidden');
                te.classList.replace('border-transparent', 'border-blue-500'); te.classList.replace('text-gray-400', 'text-blue-500');
                tp.classList.replace('border-blue-500', 'border-transparent'); tp.classList.replace('text-blue-500', 'text-gray-400');
            }
        }
        function hslToHex(str) { return str.startsWith('#') ? str : '#3b82f6'; }
    </script>
</body>
</html>
